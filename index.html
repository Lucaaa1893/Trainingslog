<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E9EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon13-180.png">
<link rel="icon" href="icon13-192.png">
<title>Trainingslog</title>
<style>
/* Layout: "Liquid Glass" – helles Raster, klare Glas-Elemente mit Lichtkanten, farbige Füllungen. Bewusst nur hell, wie die Vorlage. */
:root{
  --bg:#E6E9EE; --grid:rgba(30,45,70,.07);
  --fg:#15171B; --muted:#6A7180; --line:rgba(20,30,50,.08); --line2:rgba(20,30,50,.14);
  --accent:#2F7BF5; --accent-text:#1E68E0; --accent-soft:rgba(47,123,245,.13); --accent-ink:#FFFFFF;
  --accent2:#9358F2; --drop:#E98300; --drop-soft:rgba(255,149,0,.15); --good:#1FAA50; --bad:#E2362C;
  --glass:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.28));
  --well:rgba(255,255,255,.5);
  --rim:inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 2px rgba(20,30,50,.07), inset 1px 0 2px rgba(255,255,255,.6), inset -1px 0 2px rgba(255,255,255,.35);
  --lift:0 10px 28px -10px rgba(25,40,70,.28), 0 2px 6px -2px rgba(25,40,70,.12);
  --blur:blur(18px) saturate(185%);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; color:var(--fg); font-family:var(--f-body); font-size:16px; line-height:1.4;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/34px 34px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/34px 34px,
    var(--bg);
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  min-width:0; overflow-x:hidden;
}
.ambient{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(50px);opacity:.55;
  background:
    radial-gradient(28% 22% at 12% 18%, rgba(47,123,245,.35), transparent 70%),
    radial-gradient(26% 20% at 90% 34%, rgba(232,70,150,.22), transparent 70%),
    radial-gradient(28% 22% at 80% 82%, rgba(52,199,89,.25), transparent 70%),
    radial-gradient(24% 20% at 20% 86%, rgba(255,170,40,.22), transparent 70%);
  animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,-2%,0) rotate(6deg)}}
main{position:relative;z-index:1;max-width:640px;margin:0 auto}
h1,h2,.display{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.display{font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.kicker{font-size:13px;color:var(--muted);margin-top:4px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 2px 16px}

/* Glas-Grundmaterial */
.card,.tabs,details.session,details.p-ex,.p-tile,.pill,.empty,.sheet{
  background:var(--glass);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:var(--rim), var(--lift);
}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:6px 11px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(31,170,80,.18)}
.pill.off{color:var(--drop)}
.pill.off::before{background:var(--drop);box-shadow:0 0 0 3px var(--drop-soft)}

/* Segment-Control mit gleitender Glaslinse */
.tabs{position:relative;overflow:hidden;display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:18px;border-radius:999px;padding:4px}
.lens{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);border-radius:999px;pointer-events:none;z-index:0;
  background:linear-gradient(170deg,rgba(255,255,255,.95),rgba(255,255,255,.55));
  box-shadow:inset 0 1px 1px #fff, inset 0 -2px 4px rgba(20,30,50,.08), 0 6px 16px -6px rgba(25,40,70,.35), 0 0 0 1px rgba(255,255,255,.9);
  transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.lens::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;
  background:conic-gradient(from 200deg,rgba(47,123,245,.55),rgba(232,70,150,.45),rgba(255,190,40,.5),rgba(52,199,89,.45),rgba(47,123,245,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55}
.lens.moving{animation:stretch .55s ease-out}
@keyframes stretch{40%{scale:1.12 .9}75%{scale:.98 1.03}}
.tab{position:relative;z-index:1;border:0;background:transparent;color:var(--muted);font:600 14px/1 var(--f-body);padding:11px 4px;border-radius:999px;cursor:pointer;transition:color .3s}
.tab[aria-selected="true"]{color:var(--fg)}

.card{border-radius:26px;padding:16px;margin-bottom:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.lbl{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 6px}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--well);border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:11px 12px;width:100%;min-width:0;
  box-shadow:inset 0 1px 3px rgba(20,30,50,.12), inset 0 -1px 0 rgba(255,255,255,.8);
  transition:box-shadow .3s var(--spring), background .2s, transform .35s var(--spring)}
input::placeholder,textarea::placeholder{color:rgba(60,70,90,.35)}
input:focus,select:focus,textarea:focus{outline:none;background:rgba(255,255,255,.85);box-shadow:inset 0 1px 2px rgba(20,30,50,.08), 0 0 0 3px rgba(47,123,245,.35), 0 6px 16px -8px rgba(47,123,245,.5);transform:scale(1.03)}
button:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.txt{font-weight:500}
.meta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meta-row > *{min-width:0}

.ex-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ex-idx{font-size:12px;font-weight:600;color:var(--accent-text);margin-right:auto;font-variant-numeric:tabular-nums}
.ex-name{font:600 20px/1.25 var(--f-display);letter-spacing:-.01em;padding:2px 2px 9px;background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;margin-bottom:12px;box-shadow:none}
.ex-name{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;color:var(--fg)}
.ex-name .nm{min-width:0;overflow-wrap:anywhere}
.ex-name .chev{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);border-radius:999px;padding:5px 10px;box-shadow:inset 0 1px 1px rgba(255,255,255,.8)}
.note{margin-bottom:12px;font-size:14px;padding:10px 12px}

.sets-head,.set,.drop-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 76px 32px;gap:6px;align-items:center}
.sets-head{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.sets-head span:nth-child(2),.sets-head span:nth-child(3),.sets-head span:nth-child(4){text-align:center}
.set{margin-bottom:7px}
.set input,.drop-row input{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;padding:10px 4px}
.set select{font-size:13px;font-weight:600;padding:10px 4px;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none;color:var(--muted);border-radius:999px}
.num{font-size:14px;font-weight:600;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.set.drop .num{color:var(--drop)}
.set.drop select{color:#fff;background:linear-gradient(180deg,#FFAD33,#F08A00);border-color:rgba(255,255,255,.6);box-shadow:inset 0 1px 1px rgba(255,255,255,.6), 0 6px 14px -6px rgba(240,138,0,.7)}
.drops{display:grid;gap:6px;margin:0 0 9px;padding:7px 0;border-radius:18px;background:linear-gradient(160deg,rgba(255,170,40,.18),rgba(255,170,40,.06));border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 1px rgba(255,255,255,.9), inset 0 0 0 1px rgba(240,138,0,.18)}
.drop-row input{background:rgba(255,255,255,.65);font-size:15px;padding:8px 4px}
.drop-row input:focus{box-shadow:0 0 0 3px rgba(240,138,0,.35)}
.drop-arrow{color:var(--drop);text-align:center;font-weight:700}
.drop-lbl{font-size:11px;font-weight:700;color:var(--drop);text-align:center;line-height:1.15}
.drop-add{display:grid;grid-template-columns:28px minmax(0,1fr) 32px;gap:6px}
.add-drop{grid-column:2;background:rgba(255,255,255,.55);color:var(--drop);border:1px solid rgba(255,255,255,.8);border-radius:999px;padding:8px;font:600 13px/1 var(--f-body);box-shadow:var(--rim)}

button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(180deg,#4B8EFF,#2A6FEA);color:var(--accent-ink);border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:16px;font:600 17px/1 var(--f-body);width:100%;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.6), inset 0 -2px 4px rgba(10,40,120,.25), 0 12px 26px -10px rgba(47,123,245,.75)}
.ghost{background:rgba(255,255,255,.5);color:var(--accent-text);border:1px solid rgba(255,255,255,.8);border-radius:999px;padding:12px;font:600 15px/1 var(--f-body);width:100%;margin-top:4px;box-shadow:var(--rim), 0 4px 12px -6px rgba(25,40,70,.2)}
.ghost.alt{color:var(--fg)}
.icon{background:linear-gradient(170deg,rgba(255,255,255,.9),rgba(255,255,255,.45));border:1px solid rgba(255,255,255,.85);color:var(--fg);border-radius:50%;width:32px;height:32px;font-size:15px;font-weight:600;flex:0 0 auto;display:inline-grid;place-items:center;padding:0;
  box-shadow:inset 0 1px 1px #fff, inset 0 -2px 3px rgba(20,30,50,.08), 0 4px 10px -4px rgba(25,40,70,.3)}
.icon:disabled{opacity:.35;cursor:default;box-shadow:none}
.ex-top .icon.rm,.drop-row .icon{color:var(--bad)}
.drop-row .icon{color:var(--drop)}
.ex-actions{display:flex;gap:8px;margin-top:6px}
.ex-actions .ghost{margin-top:0;flex:1 1 0;min-width:0}
#last-all{margin-top:12px}

.empty{text-align:center;padding:30px 14px;border-radius:26px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);min-height:18px;margin:10px 6px 0}
.status.err{color:var(--drop)}

details.session{border-radius:24px;margin-bottom:12px;overflow:hidden}
details.session > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.session > summary::-webkit-details-marker{display:none}
details.session > summary > div{min-width:0}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:5px 11px;white-space:nowrap;background:rgba(255,255,255,.6);box-shadow:inset 0 1px 1px #fff}
.badge.Push{color:#fff;background:linear-gradient(180deg,#4B8EFF,#2A6FEA)}
.badge.Pull{color:#fff;background:linear-gradient(180deg,#A877FF,#8A4FF0)}
.body{padding:0 16px 14px;border-top:1px solid var(--line)}
.hx{padding:12px 0;border-bottom:1px solid var(--line)}
.hx:last-of-type{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-variant-numeric:tabular-nums;font-size:13px;font-weight:500;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);border-radius:999px;padding:5px 10px;box-shadow:inset 0 1px 1px #fff}
.chip.drop{color:#9A5400;background:var(--drop-soft)}
.danger{color:var(--bad);border:1px solid rgba(255,255,255,.8);background:rgba(226,54,44,.1);border-radius:999px;padding:9px 16px;margin-top:12px;font-weight:600;font-size:14px}

.backup{margin-top:20px}
.backup .row > *{flex:1 1 140px}
.backup textarea{font:13px/1.4 var(--f-mono);min-height:90px;margin-top:10px}

.p-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.p-tile{border-radius:22px;padding:12px 14px}
.p-tile b{display:block;font:700 32px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.p-tile span{font-size:12px;font-weight:500;color:var(--muted)}
.p-tile.up b{color:var(--good)} .p-tile.down b{color:var(--bad)}
.p-group{font-size:13px;font-weight:600;color:var(--muted);margin:20px 6px 8px}
details.p-ex{border-radius:22px;margin-bottom:10px}
details.p-ex > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr 84px auto;gap:10px;align-items:center}
details.p-ex > summary::-webkit-details-marker{display:none}
.p-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.p-sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.spark{width:84px;height:30px;display:block;color:var(--accent-text)}
.trend{font-size:12px;font-weight:600;border-radius:999px;padding:5px 9px;white-space:nowrap;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.6);color:var(--muted);box-shadow:inset 0 1px 1px #fff}
.trend.up{color:#fff;background:linear-gradient(180deg,#3DD26C,#1FAA50)}
.trend.down{color:#fff;background:linear-gradient(180deg,#FF5E55,#E2362C)}
.p-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.p-table th{font-weight:600;color:var(--muted);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 4px;border-bottom:1px solid var(--line2)}
.p-table td{padding:7px 4px;border-bottom:1px solid var(--line)}
.p-wrap{padding:0 14px 12px;overflow-x:auto}
.vol svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* Auswahl-Fenster */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(30,40,60,.18);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:640px;max-height:82vh;overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(245,247,250,.82));
  border-bottom:0;border-radius:30px 30px 0 0;
  padding-block:0 calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  animation:up .5s var(--spring)}
@keyframes up{from{transform:translateY(60px) scale(.98);opacity:.3}}
@keyframes fade{from{opacity:0}}
.sheet-top{position:sticky;top:0;z-index:2;padding:8px 0 10px;background:linear-gradient(rgba(250,251,253,.97) 80%,rgba(250,251,253,0))}
.sheet-grab{width:38px;height:5px;border-radius:3px;background:rgba(20,30,50,.18);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.p-cat{font-size:13px;font-weight:600;color:var(--muted);margin:14px 6px 4px}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:13px 6px;font-size:16px;border-radius:12px}
.pick .nm{min-width:0;overflow-wrap:anywhere}
.pick .tag{flex:0 0 auto;font-size:12px;color:var(--muted)}
.pick.cur{color:var(--accent-text);font-weight:600}
.new-box{background:var(--accent-soft);border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:12px;margin-top:4px;box-shadow:inset 0 1px 1px #fff}
.new-box .nm{display:block;font-weight:600;color:var(--accent-text);margin:0 2px 10px;overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid rgba(255,255,255,.85);border-radius:999px;padding:11px 4px;font:600 15px/1 var(--f-body);background:rgba(255,255,255,.7);color:var(--fg);box-shadow:var(--rim)}
.seg button.def{color:#fff;background:linear-gradient(180deg,#4B8EFF,#2A6FEA);box-shadow:inset 0 1px 1px rgba(255,255,255,.6), 0 8px 18px -8px rgba(47,123,245,.8)}
.pick-none{color:var(--muted);font-size:14px;padding:14px 6px}

/* Druck-Animation: Gel-Wackeln + Lichtreflex an der Fingerposition */
button,.tab{position:relative;-webkit-user-select:none;user-select:none}
button::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--px,50%) var(--py,50%), rgba(255,255,255,.95), rgba(255,255,255,.35) 25%, rgba(255,255,255,0) 60%)}
.press{animation:jelly .6s var(--spring)}
.btn.press,.ghost.press,.ex-name.press,.pick.press,.add-drop.press,.danger.press{animation-name:jelly-soft}
.press::after{animation:shine .7s ease-out}
@keyframes jelly{0%{transform:scale(1)}22%{transform:scale(1.18,1.1)}48%{transform:scale(.93,.97)}72%{transform:scale(1.04,1.02)}100%{transform:scale(1)}}
@keyframes jelly-soft{0%{transform:scale(1)}25%{transform:scale(1.035,1.06)}55%{transform:scale(.985,.975)}100%{transform:scale(1)}}
@keyframes shine{0%{opacity:1}100%{opacity:0}}
.pop-in{animation:popin .55s var(--spring)}
@keyframes popin{from{transform:scale(.92);opacity:0}}

input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=date]{min-height:44px;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}

/* ===== Mehr Liquid ===== */
:root{
  --glass:linear-gradient(155deg,rgba(255,255,255,.52),rgba(255,255,255,.12) 55%,rgba(255,255,255,.3));
  --blur:blur(14px) saturate(220%) brightness(1.04);
  --rim:inset 0 0 0 1px rgba(255,255,255,.5), inset 1.5px 1.5px 0 -.5px rgba(255,255,255,.95), inset -1px -1px 0 -.5px rgba(255,255,255,.65), inset 0 14px 22px -16px rgba(255,255,255,.95), inset 0 -12px 22px -16px rgba(255,255,255,.8), inset 0 -2px 6px -2px rgba(20,30,50,.08);
  --drop-btn:radial-gradient(130% 100% at 30% 0%, rgba(255,255,255,.98), rgba(255,255,255,.55) 42%, rgba(255,255,255,.2) 72%, rgba(255,255,255,.5));
  --drop-shadow:inset 0 0 0 1px rgba(255,255,255,.6), inset 0 -6px 10px -6px rgba(255,255,255,.95), inset 0 3px 4px -3px #fff, inset 0 -1px 3px rgba(20,30,50,.1), 0 8px 18px -8px rgba(25,40,70,.35);
  --shine:radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,.6), rgba(255,255,255,0) 52%);
}
.ambient{opacity:1;filter:blur(36px);
  background:
    radial-gradient(30% 24% at 12% 16%, rgba(47,123,245,.5), transparent 70%),
    radial-gradient(26% 22% at 92% 30%, rgba(232,70,150,.38), transparent 70%),
    radial-gradient(30% 24% at 78% 80%, rgba(52,199,89,.38), transparent 70%),
    radial-gradient(26% 22% at 18% 84%, rgba(255,170,40,.38), transparent 70%),
    radial-gradient(22% 18% at 55% 52%, rgba(150,90,245,.22), transparent 70%)}
.card,.tabs,details.session,details.p-ex,.p-tile,.pill,.empty{position:relative;border-color:rgba(255,255,255,.55);box-shadow:var(--rim), var(--lift)}
.card,details.session,details.p-ex,.p-tile{background:radial-gradient(240px circle at var(--mx,25%) var(--my,-40px), rgba(255,255,255,.6), rgba(255,255,255,0) 70%), var(--glass)}
/* Regenbogen-Kante wie gebrochenes Licht */
.card::before,details.session::before,details.p-ex::before,.p-tile::before,.tabs::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:0;
  background:conic-gradient(from 210deg, rgba(255,255,255,.95), rgba(110,165,255,.6), rgba(255,255,255,.25), rgba(255,130,200,.5), rgba(255,255,255,.95), rgba(255,205,110,.5), rgba(120,225,165,.5), rgba(255,255,255,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55}
/* Tropfen-Knöpfe */
.icon,.ghost,.add-drop,.seg button:not(.def),.chip:not(.drop),.trend:not(.up):not(.down),.badge:not(.Push):not(.Pull),.danger{background:var(--drop-btn);border-color:rgba(255,255,255,.5);box-shadow:var(--drop-shadow)}
.danger{background:radial-gradient(130% 100% at 30% 0%, rgba(255,255,255,.9), rgba(255,220,218,.5) 45%, rgba(255,120,110,.18))}
.add-drop{background:radial-gradient(130% 100% at 30% 0%, rgba(255,255,255,.95), rgba(255,236,205,.6) 45%, rgba(255,180,80,.22))}
.btn{background:var(--shine), linear-gradient(180deg,#4B8EFF,#2A6FEA);box-shadow:inset 0 1px 1px rgba(255,255,255,.7), inset 0 -8px 12px -8px rgba(255,255,255,.55), inset 0 -2px 4px rgba(10,40,120,.25), 0 14px 28px -10px rgba(47,123,245,.8)}
.seg button.def,.badge.Push{background:var(--shine), linear-gradient(180deg,#4B8EFF,#2A6FEA)}
.badge.Pull{background:var(--shine), linear-gradient(180deg,#A877FF,#8A4FF0)}
.trend.up{background:var(--shine), linear-gradient(180deg,#3DD26C,#1FAA50)}
.trend.down{background:var(--shine), linear-gradient(180deg,#FF5E55,#E2362C)}
.set.drop select{background:var(--shine), linear-gradient(180deg,#FFAD33,#F08A00);box-shadow:inset 0 1px 1px rgba(255,255,255,.7), inset 0 -6px 10px -6px rgba(255,255,255,.6), 0 8px 16px -6px rgba(240,138,0,.75)}
.lens{background:radial-gradient(120% 120% at 30% 0%, rgba(255,255,255,1), rgba(255,255,255,.55) 50%, rgba(255,255,255,.35));box-shadow:inset 0 0 0 1px rgba(255,255,255,.9), inset 0 -6px 10px -6px rgba(255,255,255,1), inset 0 -2px 5px rgba(20,30,50,.08), 0 8px 18px -8px rgba(25,40,70,.4)}
.lens::before{opacity:.85;padding:2px}
input,select,textarea{background:radial-gradient(140% 120% at 30% 0%, rgba(255,255,255,.75), rgba(255,255,255,.35) 60%);box-shadow:inset 0 1px 3px rgba(20,30,50,.12), inset 0 -4px 8px -6px rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55)}
.ex-name{background:transparent;box-shadow:none}
.drop-row input{background:radial-gradient(140% 120% at 30% 0%, rgba(255,255,255,.9), rgba(255,255,255,.5) 60%)}
.sheet{background:radial-gradient(400px circle at 20% 0%, rgba(255,255,255,.7), rgba(255,255,255,0) 70%), linear-gradient(160deg,rgba(255,255,255,.72),rgba(240,244,250,.6));-webkit-backdrop-filter:blur(26px) saturate(220%);backdrop-filter:blur(26px) saturate(220%);box-shadow:var(--rim), 0 -18px 40px -10px rgba(25,40,70,.25)}
.sheet-top{background:linear-gradient(rgba(248,250,253,.85) 80%,rgba(248,250,253,0))}

/* Gedrückt halten: Tropfen wächst und hebt ab */
button{transition:transform .45s var(--spring), box-shadow .3s ease}
.held{transform:scale(1.16);z-index:3;box-shadow:var(--drop-shadow), 0 18px 30px -10px rgba(25,40,70,.45)}
.btn.held,.ghost.held,.ex-name.held,.pick.held,.add-drop.held,.danger.held,.seg button.held{transform:scale(1.035,1.08)}
.tab.held{transform:scale(1.1)}
.held::after{opacity:.55;transition:opacity .2s}
/* Loslassen: wabbeln wie Wasser */
@keyframes jelly{0%{transform:scale(1.16)}22%{transform:scale(.9,1.1)}45%{transform:scale(1.08,.95)}68%{transform:scale(.98,1.03)}100%{transform:scale(1)}}
@keyframes jelly-soft{0%{transform:scale(1.035,1.08)}25%{transform:scale(1.05,.95)}50%{transform:scale(.99,1.03)}100%{transform:scale(1)}}
.icon.press{animation-name:blob}
@keyframes blob{0%{transform:scale(1.16);border-radius:50%}
  20%{transform:scale(.88,1.14);border-radius:44% 56% 40% 60%/60% 42% 58% 40%}
  42%{transform:scale(1.1,.92);border-radius:57% 43% 54% 46%/43% 57% 43% 57%}
  66%{transform:scale(.97,1.04);border-radius:48% 52% 51% 49%/52% 48% 52% 48%}
  100%{transform:scale(1);border-radius:50%}}
@keyframes stretch{0%{border-radius:999px}35%{scale:1.22 .84;border-radius:40% 60% 60% 40%/50%}65%{scale:.96 1.06}100%{scale:1 1}}

/* ===== Eigene Liquid-Auswahl statt iOS-Select ===== */
*{-webkit-tap-highlight-color:transparent}
.select-btn,.kind-btn{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;color:var(--fg);border:1px solid rgba(255,255,255,.7);
  background:radial-gradient(140% 120% at 30% 0%, rgba(255,255,255,.75), rgba(255,255,255,.35) 60%);
  box-shadow:inset 0 1px 3px rgba(20,30,50,.12), inset 0 -4px 8px -6px rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55)}
.select-btn{border-radius:14px;padding:11px 12px;font:500 16px/1.25 var(--f-body);min-height:46px;text-align:left}
.select-btn .chev,.kind-btn .chev{flex:0 0 auto;width:16px;height:16px;opacity:.55;transition:transform .45s var(--spring)}
.select-btn[aria-expanded="true"] .chev,.kind-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.kind-btn{border-radius:999px;padding:10px 4px;font:600 13px/1 var(--f-body);color:var(--muted);justify-content:center}
.kind-btn .chev{width:11px;height:11px}
.set.drop .kind-btn{color:#fff;border-color:rgba(255,255,255,.6);background:var(--shine), linear-gradient(180deg,#FFAD33,#F08A00);box-shadow:inset 0 1px 1px rgba(255,255,255,.7), inset 0 -6px 10px -6px rgba(255,255,255,.6), 0 8px 16px -6px rgba(240,138,0,.75)}
.kind-btn.press,.select-btn.press{animation-name:jelly-soft}
.kind-btn.held,.select-btn.held{transform:scale(1.06,1.1)}

.menu-bg{position:fixed;inset:0;z-index:60}
.menu{position:fixed;z-index:61;min-width:170px;padding:6px;border-radius:22px;isolation:isolate;
  box-shadow:0 22px 44px -14px rgba(25,40,70,.42), 0 2px 8px rgba(25,40,70,.1);
  transform-origin:var(--ox,50%) var(--oy,0);animation:menu-in .5s var(--spring)}
.menu-glass{position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:radial-gradient(220px circle at 25% 0%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%), linear-gradient(160deg,rgba(255,255,255,.9),rgba(245,248,252,.8));
  -webkit-backdrop-filter:blur(24px) saturate(220%);backdrop-filter:blur(24px) saturate(220%);
  border:1px solid rgba(255,255,255,.8);box-shadow:var(--rim)}
.menu::before{content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from 210deg, rgba(255,255,255,.95), rgba(110,165,255,.6), rgba(255,255,255,.25), rgba(255,130,200,.5), rgba(255,255,255,.95), rgba(255,205,110,.5), rgba(120,225,165,.5), rgba(255,255,255,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.6}
.menu.out{animation:menu-out .22s ease-in forwards}
@keyframes menu-in{0%{transform:scale(.3,.2);opacity:.001;border-radius:999px}55%{transform:scale(1.04,1.06);opacity:1}78%{transform:scale(.985,.99)}100%{transform:scale(1)}}
@keyframes menu-out{to{transform:scale(.5,.35);opacity:0;border-radius:999px}}
.menu-item{position:relative;z-index:1;opacity:1;display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--fg);font:500 16px/1 var(--f-body);text-align:left;padding:13px 14px;border-radius:16px;
  animation:item-in .4s var(--spring) both}
.menu-item:nth-of-type(2){animation-delay:.04s}.menu-item:nth-of-type(3){animation-delay:.08s}
@keyframes item-in{from{opacity:.001;transform:translateY(-6px)}}
.menu-item .ck{width:18px;flex:0 0 18px;color:var(--accent-text);font-weight:700;text-align:center}
.menu-item .dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;margin-left:auto;box-shadow:inset 0 1px 1px rgba(255,255,255,.7)}
.menu-item.sel{font-weight:600}
.menu-item.held{background:rgba(255,255,255,.7);box-shadow:var(--drop-shadow);transform:scale(1.04)}
.menu-item::after{display:none}

/* Druck auf Eingabefelder: weiches Wabbeln in ihrer eigenen Form */
input.press,textarea.press{animation:field .55s var(--spring)}
@keyframes field{0%{transform:scale(1)}30%{transform:scale(1.07,1.1)}60%{transform:scale(1.01,.99)}100%{transform:scale(1.03)}}

/* ===== Pop-ups im Stil der iOS-Datumsauswahl: dunkel getöntes Glas ===== */
:root{--pop:rgba(104,106,113,.74);--pop-solid:rgba(104,106,113,.96);--pop-line:rgba(255,255,255,.13);--pop-fill:rgba(255,255,255,.16);--pop-text:#FFFFFF;--pop-muted:rgba(255,255,255,.62)}
.menu{border-radius:30px;padding:8px;box-shadow:0 24px 60px -12px rgba(0,0,0,.35)}
.menu::before{display:none}
.menu-glass{background:var(--pop);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
  border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.08)}
.menu-item{color:var(--pop-text);font:600 17px/1 var(--f-body);padding:15px 16px;border-radius:22px}
.menu-item .ck{color:var(--pop-text)}
.menu-item.sel{font-weight:700}
.menu-item.held{background:var(--pop-fill);box-shadow:none;transform:scale(1.03)}
.menu-item .dot{box-shadow:0 0 0 2px rgba(255,255,255,.25)}

.sheet-bg{background:rgba(20,25,35,.12)}
.sheet{color:var(--pop-text);background:rgba(104,106,113,.9);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
  border:0;border-radius:34px 34px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 -20px 60px -12px rgba(0,0,0,.35)}
.sheet-top{background:linear-gradient(rgba(104,106,113,.9) 82%, rgba(104,106,113,0))}
.sheet-grab{background:rgba(255,255,255,.45)}
.sheet h2{color:var(--pop-text)}
.sheet .icon{background:var(--pop-fill);color:var(--pop-text);border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.sheet input{color:var(--pop-text);background:var(--pop-fill);border:0;border-radius:999px;padding:12px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.sheet input::placeholder{color:var(--pop-muted)}
.sheet input:focus{background:rgba(255,255,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 0 0 2px rgba(255,255,255,.35);transform:none}
.p-cat{color:var(--pop-muted)}
.pick{color:var(--pop-text);border-bottom-color:var(--pop-line);font-weight:600;font-size:17px;border-radius:0}
.pick.held{border-radius:18px}
.sheet input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.pick .tag{color:var(--pop-muted);font-weight:500}
.pick.cur{color:var(--pop-text);font-weight:800}
.pick.held{background:var(--pop-fill);transform:scale(1.02)}
.pick-none{color:var(--pop-muted)}
.new-box{background:var(--pop-fill);border:0;border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.new-box .nm{color:var(--pop-text)}
.seg button,.seg button:not(.def){background:rgba(255,255,255,.14);color:var(--pop-text);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.seg button.def{background:rgba(236,233,226,.62);color:#fff;border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 6px 16px -8px rgba(0,0,0,.4)}
.sheet button::after,.menu button::after{background:radial-gradient(circle at var(--px,50%) var(--py,50%), rgba(255,255,255,.45), rgba(255,255,255,0) 60%)}

/* Ändern-Knopf im Pop-up-Stil */
.ex-name .chev{border:0;cursor:pointer;color:#fff;background:rgba(104,106,113,.74);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  padding:6px 12px;font-size:13px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 6px 14px -8px rgba(0,0,0,.45)}
/* Nur das Feld selbst öffnet die Auswahl */
.meta-row .lbl{pointer-events:none;width:max-content;max-width:100%}
input[type=date]{width:100%;display:block}

/* Neuer Trainingstag: Dialog im Pop-up-Stil */
.dlg-bg{position:fixed;inset:0;z-index:70;background:rgba(20,25,35,.18);display:grid;place-items:center;padding:20px;animation:fade .2s ease}
.dlg{width:min(340px,100%);border-radius:30px;padding:20px 18px 16px;color:#fff;background:rgba(104,106,113,.9);
  -webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 24px 60px -12px rgba(0,0,0,.4);animation:menu-in .5s var(--spring)}
.dlg h2{color:#fff;margin-bottom:6px}
.dlg-sub{margin:0 0 14px;font-size:14px;color:rgba(255,255,255,.75)}
.dlg input{color:#fff;background:rgba(255,255,255,.16);border:0;border-radius:999px;padding:12px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.dlg input::placeholder{color:rgba(255,255,255,.6)}
.dlg input:focus{background:rgba(255,255,255,.24);box-shadow:0 0 0 2px rgba(255,255,255,.35);transform:none}
.dlg-err{min-height:18px;margin:8px 4px 4px;font-size:13px;color:#FFD0CC}
.dlg-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg-btns button{border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:13px;font:600 16px/1 var(--f-body);color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.dlg-btns .dlg-ok{background:rgba(236,233,226,.62);border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.seg{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
.menu-item[data-v="__new"]{color:rgba(255,255,255,.85);border-top:1px solid rgba(255,255,255,.14);border-radius:0 0 22px 22px;margin-top:4px}

.danger.wide{width:100%;padding:13px 16px;margin-top:6px;font-size:15px}
.wipe h2{margin-bottom:4px}
.wipe .muted{margin:0 0 8px}
.dlg-btns .dlg-del{color:#fff;background:linear-gradient(180deg,#FF5E55,#E2362C);border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 8px 18px -8px rgba(226,54,44,.8)}

.meta-actions{display:flex;gap:8px;margin-top:12px}
.meta-actions .ghost{margin-top:0;flex:1 1 0;min-width:0}
#last-all{margin-top:0}
.ghost.clr{color:var(--bad)}
.ex-actions .ghost{padding:12px 8px;font-size:14px}

.s-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.s-del{width:34px;height:34px;color:var(--bad)}
.ver{text-align:center;font-size:12px;color:var(--muted);margin:24px 0 0}

/* Wischen zum Löschen */
.swipe-hint{font-size:12px;color:var(--muted);text-align:center;margin:0 0 10px}
.swipe{position:relative;margin-bottom:12px;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.swipe details.session{position:relative;z-index:1;margin-bottom:0;transition:transform .5s var(--spring)}
.swipe.drag details.session{transition:none}
.swipe-act{position:absolute;top:0;right:0;bottom:0;width:86px;display:grid;place-items:center;z-index:0;opacity:var(--p,0);transition:opacity .3s}
.swipe.drag .swipe-act{transition:none}
.swipe-del{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;padding:0;color:#fff;border:1px solid rgba(255,255,255,.45);
  background:var(--shine), linear-gradient(180deg,#FF5E55,#E2362C);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.6), inset 0 -6px 10px -6px rgba(255,255,255,.5), 0 10px 22px -8px rgba(226,54,44,.8);
  transform:scale(calc(.55 + var(--p,0) * .45))}
.swipe-del svg{width:22px;height:22px}

/* Volumen-Übersicht */
.vol-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.vchip{border:1px solid rgba(255,255,255,.8);border-radius:999px;padding:7px 13px;font:600 13px/1 var(--f-body);color:var(--fg);background:var(--drop-btn);box-shadow:var(--drop-shadow)}
.vchip.on{color:#fff;background:var(--shine), var(--c, #3A3D45);border-color:rgba(255,255,255,.5)}
.vstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.vstats > div{background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);border-radius:16px;padding:10px;box-shadow:inset 0 1px 1px #fff;min-width:0}
.vstats b{display:block;font:700 18px/1.1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.vstats b.up,.vtip .up{color:var(--good)} .vstats b.down,.vtip .down{color:var(--bad)}
.vstats span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.2}
.vwrap{position:relative;margin:0 -4px}
.vscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-left:4px}
.vscroll::-webkit-scrollbar{display:none}
.vscroll svg{display:block;max-width:none}
.vy{position:absolute;left:4px;top:0;bottom:0;pointer-events:none;z-index:1;width:0}
.vy span{position:absolute;left:0;font-size:10px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.75);border-radius:999px;padding:1px 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.vbar{cursor:pointer;outline:none}
.vbar:focus-visible rect:nth-child(2){stroke:var(--accent);stroke-width:2}
.vtip{display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 1px #fff;font-size:13px;line-height:1.4;font-variant-numeric:tabular-nums}
.vtip .dotc{width:10px;height:10px;border-radius:50%;flex:0 0 10px;margin-top:4px}
.vtip b{font-weight:600}
.legend .ln{width:16px;height:2px;border-radius:2px;background:var(--fg);opacity:.55;vertical-align:3px}

/* Kalender */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cal-head h2{font-size:20px}
.cal-head .icon{width:36px;height:36px;font-size:22px;line-height:1;padding-bottom:2px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px 4px;margin-bottom:12px}
.cw{text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding-bottom:2px}
.cd{aspect-ratio:1;max-width:100%;width:100%;max-height:44px;justify-self:center;border:0;border-radius:50%;background:transparent;color:var(--fg);font:600 15px/1 var(--f-body);font-variant-numeric:tabular-nums;display:grid;place-items:center;padding:0}
.cd.empty{visibility:hidden}
.cd.future{color:rgba(60,70,90,.35)}
.cd.today:not(.has){box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent-text)}
.cd.has{color:#fff;background:var(--shine), var(--c);box-shadow:inset 0 1px 1px rgba(255,255,255,.55), inset 0 -4px 7px -4px rgba(255,255,255,.5), 0 6px 12px -6px rgba(25,40,70,.5)}
.cd.sel{transform:scale(1.12);box-shadow:0 0 0 2.5px #fff, 0 0 0 4.5px rgba(30,40,60,.18), 0 8px 16px -6px rgba(25,40,70,.45)}
.cd.sel:not(.has){background:rgba(255,255,255,.75);color:var(--fg)}
.cal-legend{flex-wrap:wrap;margin:0 0 12px}
.cal-legend b{color:var(--fg);font-weight:600}
.vstats em{font-style:normal;font-weight:700}
.vstats em.up{color:var(--good)} .vstats em.down{color:var(--bad)}
.cdet{display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 1px #fff;font-size:13px;line-height:1.4;font-variant-numeric:tabular-nums}
.cdet .dotc{width:10px;height:10px;border-radius:50%;flex:0 0 10px;margin-top:4px}
.cdet b{font-weight:600}
.cex{color:var(--muted);font-size:12px;margin-top:2px}


/* Tab-Linse: iOS-Liquid-Glass beim Drücken und Ziehen */
.tabs{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.tabs.grabbing{overflow:hidden}
.lens{transition:translate .5s cubic-bezier(.3,1.3,.5,1), scale .45s var(--spring), box-shadow .3s ease, background .3s ease}
.lens.drag{transition:scale .45s var(--spring), box-shadow .3s ease, background .3s ease}
.lens.grab{scale:1.07 1.1;
  background:radial-gradient(120% 120% at 30% 0%, rgba(255,255,255,.85), rgba(255,255,255,.35) 50%, rgba(255,255,255,.45));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.95), inset 2px 3px 0 -1px #fff, inset 0 -8px 12px -8px rgba(255,255,255,1), inset 0 -2px 6px rgba(20,30,50,.12), 0 14px 30px -10px rgba(25,40,70,.45)}
.lens.grab::before{opacity:1}
.tab.hover{color:var(--fg)}
.tab.held,.tab.press{transform:none!important;box-shadow:none!important;animation:none!important}
.tab{transition:color .25s ease, scale .35s var(--spring)}
.tabs.grabbing .tab.hover,.tab.hover{scale:1.18}
.tab::after{display:none}
.tabs.grabbing .tab[aria-selected="true"]:not(.hover){color:var(--muted)}

.ver-btn{border:0;background:none;color:var(--accent-text);font:600 12px/1 var(--f-body);padding:4px;text-decoration:underline}
.ver-btn::after{display:none}
.upd{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:12px;
  padding:8px 8px 8px 18px;border-radius:999px;color:#fff;background:rgba(104,106,113,.9);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 18px 40px -12px rgba(0,0,0,.4);font-weight:600;font-size:15px;white-space:nowrap;animation:menu-in .5s var(--spring)}
.upd button{border:0;border-radius:999px;padding:10px 16px;font:700 15px/1 var(--f-body);color:#fff;background:var(--shine), linear-gradient(180deg,#4B8EFF,#2A6FEA)}

/* iOS-26-Tab-Leiste: graue Pille in Ruhe, klare Glasblase in Bewegung */
.tabs,.tabs.grabbing{overflow-x:clip;overflow-y:visible}
.tabs::before{display:none}
.lens::before{display:none}
.lens{background:rgba(118,118,128,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.55), inset 0 0 0 .5px rgba(255,255,255,.45);
  transition:translate .55s cubic-bezier(.3,1.25,.45,1), scale .42s var(--spring), background .3s ease, box-shadow .3s ease}
.lens.drag{transition:scale .42s var(--spring), background .3s ease, box-shadow .3s ease}
.lens.moving{animation:none}
.lens.grab,.lens.travel{scale:1.1 1.45;
  background:radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.6), rgba(255,255,255,.06) 55%, rgba(255,255,255,.22));
  -webkit-backdrop-filter:blur(.6px) saturate(170%) brightness(1.05);backdrop-filter:blur(.6px) saturate(170%) brightness(1.05);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.95), inset 0 2px 1px #fff, inset 0 -3px 6px -2px rgba(255,255,255,.95), inset 0 0 16px rgba(110,120,150,.22), 0 12px 28px -10px rgba(30,40,70,.45)}
.tab{transition:color .25s ease, scale .35s var(--spring)}
.tab[aria-selected="true"],.tab.hover{color:var(--accent-text)}
.tabs.grabbing .tab[aria-selected="true"]:not(.hover){color:var(--muted)}

/* Dicker Lupen-Rand: am Rand der Glasblase wird der Hintergrund verzerrt/vergrößert */
.lens::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:0;opacity:0;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.12) 45%,rgba(255,255,255,.55));
  -webkit-backdrop-filter:blur(2.5px) saturate(200%) brightness(1.12) contrast(1.15);backdrop-filter:blur(2.5px) saturate(200%) brightness(1.12) contrast(1.15);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  transition:opacity .25s ease, padding .35s var(--spring)}
.lens.grab::after,.lens.travel::after{opacity:1;padding:9px}
.lens.drag::after{padding:11px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="ambient" aria-hidden="true"></div>
<main>
<header>
  <div>
    <h1>Trainingslog</h1>
    <div class="kicker">Push · Pull · Fortschritt</div>
  </div>
  <span class="pill" id="net">Online</span>
</header>

<div class="tabs" role="tablist">
  <span class="lens" id="lens" aria-hidden="true"></span>
  <button class="tab" role="tab" id="tab-new" aria-controls="view-new" aria-selected="true">Eintragen</button>
  <button class="tab" role="tab" id="tab-hist" aria-controls="view-hist" aria-selected="false">Verlauf</button>
  <button class="tab" role="tab" id="tab-prog" aria-controls="view-prog" aria-selected="false">Fortschritt</button>
</div>

<!-- NEW SESSION -->
<section id="view-new" role="tabpanel" aria-labelledby="tab-new">
  <div class="card">
    <div class="meta-row">
      <div>
        <span class="lbl" id="l-date">Datum</span>
        <input type="date" id="s-date" aria-labelledby="l-date">
      </div>
      <div>
        <span class="lbl" id="l-type">Trainingstag</span>
        <button class="select-btn" id="s-type" type="button" aria-labelledby="l-type s-type" aria-haspopup="menu" aria-expanded="false"><span id="s-type-label">Push</span></button>
      </div>
    </div>
    <div class="meta-actions">
      <button class="ghost alt" id="last-all" type="button" hidden>↺ Alle letzten</button>
      <button class="ghost alt clr" id="clear-all" type="button">Alle leeren</button>
    </div>
  </div>

  <div id="editor"></div>

  <button class="ghost" id="add-ex" type="button">+ Übung hinzufügen</button>
  <div style="height:12px"></div>
  <button class="btn" id="save" type="button">Session speichern</button>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</section>

<!-- HISTORY -->
<section id="view-hist" role="tabpanel" aria-labelledby="tab-hist" hidden>
  <div id="history"></div>
  <div class="card backup">
    <h2>Sicherung</h2>
    <p class="muted small">Deine Daten liegen nur auf diesem Gerät. Sichere sie ab und zu, z. B. in Notizen oder als Datei.</p>
    <div class="row">
      <button class="ghost" id="exp" type="button">Exportieren</button>
      <button class="ghost" id="imp-btn" type="button">Importieren</button>
    </div>
    <input type="file" id="imp-file" accept="application/json,.json,.txt" hidden>
    <textarea id="imp-text" placeholder="Oder Sicherungstext hier einfügen und auf „Text übernehmen“ tippen" aria-label="Sicherungstext"></textarea>
    <button class="ghost" id="imp-apply" type="button">Text übernehmen</button>
    <p class="status" id="bstatus" role="status" aria-live="polite"></p>
  </div>
</section>

<!-- PROGRESS -->
<section id="view-prog" role="tabpanel" aria-labelledby="tab-prog" hidden>
  <div id="progress"></div>
</section>

<p class="ver"><span id="ver-txt">Version 43</span> · <button type="button" class="ver-btn" id="ver-check">Nach Updates suchen</button></p>
<div class="upd" id="upd" hidden><span>Neue Version verfügbar</span><button type="button" id="upd-go">Jetzt laden</button></div>
</main>
<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-top">
      <div class="sheet-grab" aria-hidden="true"></div>
      <div class="sheet-head"><h2 id="sheet-title">Übung wählen</h2><button class="icon" id="sheet-close" type="button" aria-label="Schließen">✕</button></div>
      <input id="sheet-search" type="search" placeholder="Suchen oder neue Übung eingeben" autocomplete="off" enterkeyhint="done" aria-label="Übung suchen">
    </div>
    <div id="sheet-list"></div>
  </div>
</div>
<script>
(function(){
  const KEY = 'trainingslog-v1';
  const $ = (s, r=document) => r.querySelector(s);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = () => { const d = new Date(); const z = new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
  const fmtDate = iso => new Date(iso+'T00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
  const fmtKg = n => (n==null||n==='') ? '–' : String(n).replace('.',',');

  // ---- storage (per browser; wrapped because storage can be unavailable) ----
  let data = { sessions: [], draft: null };
  let storageOk = true;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) data = Object.assign(data, JSON.parse(raw));
  } catch(e){ storageOk = false; }
  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch(e){ storageOk = false; return false; }
  }
  const TEMPLATES = {
    Push: [
      'Brustdrücken an der Maschine',
      'Schrägbankdrücken mit Kurzhanteln (frei)',
      'Butterflys',
      'Schulterdrücken mit Kurzhanteln (frei)',
      'Seitheben an der Maschine',
      'Trizeps am Kabelturm unilateral',
      'Trizeps am Kabelturm über Kopf'
    ],
    Pull: [
      'Latziehen',
      'T-Zug',
      'Rudern',
      'Reverse Butterfly',
      'Rückenstrecker',
      'Bizeps an der Bizepsmaschine',
      'Bizeps am Kabelturm unilateral'
    ]
  };
  function lastNote(name){
    for (let k = data.sessions.length - 1; k >= 0; k--){
      const e = data.sessions[k].exercises.find(x => x.name === name);
      if (e && e.note) return e.note;
    }
    return (data.notes && data.notes[name]) || '';
  }
  // Trainingstage: Push und Pull fest, eigene Tage (z. B. Beine) kommen dazu
  const DAY_COLORS = ['#22B455','#F08A00','#E8467C','#1FA8D9','#D4A80A','#6B7280'];
  function days(){
    const own = (data.days || []).map((d, k) => ({ name: d.name, color: d.color || DAY_COLORS[k % DAY_COLORS.length] }));
    return [{ name:'Push', color:'#2F7BF5' }, { name:'Pull', color:'#9358F2' }, ...own];
  }
  const dayColor = t => (days().find(d => d.name === t) || { color:'#9AA3B2' }).color;
  // Übungsliste eines Tages: Push/Pull immer in der ursprünglichen Reihenfolge,
  // eigene Tage in der Reihenfolge, in der ihre Übungen angelegt wurden
  function templateFor(type){
    if (TEMPLATES[type]) return TEMPLATES[type].slice();
    return (data.custom || []).filter(c => typeof c === 'object' && c.cat === type).map(c => c.name);
  }
  function fromTemplate(type){
    return templateFor(type).map(n => ({ name: n, note: lastNote(n), sets: [{reps:'',kg:''},{reps:'',kg:''},{reps:'',kg:''}] }));
  }
  function untouched(d){
    return d.exercises.every(e => e.sets.every(s => s.reps === '' && s.kg === '' && s.kind !== 'drop'));
  }
  // Last logged values for the same exercise and set, shown as placeholder.
  function lastSet(name, j){
    for (let k = data.sessions.length - 1; k >= 0; k--){
      const e = data.sessions[k].exercises.find(x => x.name === name);
      if (e) return e.sets[j] || null;
    }
    return null;
  }
  const dropsOf = x => Array.isArray(x.drops) ? x.drops : (x.drop ? [x.drop] : []);
  // Letzte gespeicherte Ausführung einer Übung (nach Datum)
  function lastEx(name){
    const n = (name || '').trim(); if (!n) return null;
    const list = [...data.sessions].sort((a, b) => (a.date + a.id).localeCompare(b.date + b.id));
    for (let k = list.length - 1; k >= 0; k--){
      const e = list[k].exercises.find(x => x.name === n);
      if (e) return { ex: e, date: list[k].date };
    }
    return null;
  }
  // Füllt nur leere Felder, bereits Eingetragenes bleibt stehen
  function applyLast(ex){
    const hit = lastEx(ex.name); if (!hit) return null;
    const L = hit.ex;
    while (ex.sets.length < L.sets.length) ex.sets.push({ reps:'', kg:'' });
    L.sets.forEach((ls, j) => {
      const s = ex.sets[j];
      if (s.reps === '' || s.reps == null) s.reps = ls.reps ?? '';
      if (s.kg === '' || s.kg == null) s.kg = ls.kg ?? '';
      if (ls.kind === 'drop' && s.kind !== 'drop'){ s.kind = 'drop'; s.drops = dropsOf(ls).map(d => ({ reps: d.reps ?? '', kg: d.kg ?? '' })); }
    });
    if (!ex.note && L.note) ex.note = L.note;
    if (!ex.note) ex.note = lastNote(ex.name);
    return hit.date;
  }
  const shortDate = iso => new Date(iso + 'T00:00').toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit' });
  function fitName(t){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
  function newDraft(){
    return { date: today(), type: 'Push', exercises: fromTemplate('Push') };
  }
  if (!data.draft) data.draft = newDraft();
  if (!Array.isArray(data.sessions)) data.sessions = [];
  if (!data.draft.exercises.length) data.draft.exercises = fromTemplate(data.draft.type);
  data.draft.exercises.forEach(e => e.sets.forEach(x => {
    if (x.kind === 'drop' && !Array.isArray(x.drops)) x.drops = [{ reps: x.dropReps ?? '', kg: x.dropKg ?? '' }];
    delete x.dropReps; delete x.dropKg;
  }));

  // ---- status line ----
  function say(msg, isErr){
    const el = $('#status');
    el.textContent = msg;
    el.classList.toggle('err', !!isErr);
  }



  // ---- Update-Prüfung: vergleicht die eigene Version mit der auf GitHub ----
  const MY_VERSION = 43;
  async function serverVersion(){
    const r = await fetch('./index.html?check=' + Date.now(), { cache:'no-store' });
    const t = await r.text(); const m = /id="ver-txt">Version (\d+)</.exec(t) || /Version (\d+)</.exec(t);
    return m ? +m[1] : 0;
  }
  async function hardUpdate(){
    try { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); } catch(_){}
    try { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); } catch(_){}
    location.replace(location.pathname + '?v=' + Date.now());   // Trainingsdaten bleiben erhalten
  }
  async function checkUpdate(manual){
    if (!navigator.onLine){ if (manual) say('Offline – Update-Prüfung braucht Internet.', true); return; }
    try {
      const v = await serverVersion();
      if (v > MY_VERSION){ $('#upd').hidden = false; if (manual) say(`Version ${v} ist verfügbar.`); }
      else if (manual) say('Du hast die neueste Version.');
    } catch(_){ if (manual) say('Update-Prüfung hat nicht geklappt.', true); }
  }
  $('#ver-check').addEventListener('click', () => checkUpdate(true));
  $('#upd-go').addEventListener('click', hardUpdate);
  setTimeout(() => checkUpdate(false), 1500);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(false); });
  // ---- Liquid-Glass-Interaktionen ----
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let heldEl = null;
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest('button');
    if (!el || el.disabled || reduce) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--px', (e.clientX - r.left) + 'px');
    el.style.setProperty('--py', (e.clientY - r.top) + 'px');
    el.classList.remove('press'); el.classList.add('held'); heldEl = el;
  }, { passive:true });
  function release(){
    if (!heldEl) return;
    const el = heldEl; heldEl = null;
    el.classList.remove('held'); void el.offsetWidth; el.classList.add('press');
  }
  ['pointerup','pointercancel'].forEach(t => document.addEventListener(t, release, { passive:true }));
  // Lichtreflex: folgt dem Finger und wandert beim Scrollen über das Glas
  const glassSel = '.card,details.session,details.p-ex,.p-tile';
  document.addEventListener('pointermove', e => {
    const c = e.target.closest && e.target.closest(glassSel); if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }, { passive:true });
  let sheenQueued = false;
  function sheen(){
    sheenQueued = false;
    const h = innerHeight;
    document.querySelectorAll(glassSel).forEach(c => {
      const r = c.getBoundingClientRect(); if (r.bottom < 0 || r.top > h) return;
      const t = Math.max(0, Math.min(1, (r.top + r.height / 2) / h));
      c.style.setProperty('--mx', (15 + t * 70) + '%');
      c.style.setProperty('--my', (h * 0.18 - r.top) + 'px');
    });
  }
  if (!reduce){ addEventListener('scroll', () => { if (!sheenQueued){ sheenQueued = true; requestAnimationFrame(sheen); } }, { passive:true }); setTimeout(sheen, 50); }
  document.addEventListener('animationend', e => {
    if (e.animationName === 'jelly' || e.animationName === 'jelly-soft') e.target.classList.remove('press');
    if (e.animationName === 'popin') e.target.classList.remove('pop-in');
  });
  function moveLens(which){
    const idx = ['new','hist','prog'].indexOf(which), lens = $('#lens');
    if (!lens || idx < 0) return;
    const prev = lens.dataset.idx;
    lens.style.translate = `${idx * 100}% 0`;
    if (prev != null && +prev !== idx && !reduce){
      // wie iOS: Pille wird beim Wechseln zur großen Glasblase, gleitet rüber und schrumpft wieder
      lens.style.transformOrigin = `${idx * 50}% 50%`;
      lens.classList.add('travel');
      clearTimeout(lens._t); lens._t = setTimeout(() => lens.classList.remove('travel'), 420);
      const from = +prev, to = idx, step = to > from ? 1 : -1;
      for (let k = from; k !== to + step; k += step) setTimeout(() => hoverTab(k === to ? -1 : k), Math.abs(k - from) * 120);
    }
    lens.dataset.idx = idx;
  }
  $('#lens').addEventListener('animationend', e => e.currentTarget.classList.remove('moving'));


  // ---- Liquid-Menü (ersetzt die iOS-Auswahl) ----
  const TRASH = '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.2c.05.7.6 1.3 1.3 1.3h3.2c.7 0 1.25-.6 1.3-1.3l.6-8.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CHEV = '<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let menuState = null;
  function openMenu(anchor, options, current, onPick){
    closeMenu(true);
    const bg = document.createElement('div'); bg.className = 'menu-bg';
    const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role','menu');
    m.innerHTML = '<span class="menu-glass" aria-hidden="true"></span>' + options.map(o => `<button type="button" class="menu-item${o.value === current ? ' sel' : ''}" role="menuitemradio" aria-checked="${o.value === current}" data-v="${esc(o.value)}"><span class="ck">${o.value === current ? '✓' : ''}</span>${esc(o.label)}${o.color ? `<span class="dot" style="background:${o.color}"></span>` : ''}</button>`).join('');
    document.body.append(bg, m);
    const a = anchor.getBoundingClientRect(), mw = Math.max(m.offsetWidth, a.width), mh = m.offsetHeight, pad = 12;
    m.style.minWidth = mw + 'px';
    let left = Math.min(Math.max(pad, a.right - mw), innerWidth - mw - pad);
    let top = a.bottom + 8; if (top + mh > innerHeight - pad) top = Math.max(pad, a.top - mh - 8);
    m.style.left = left + 'px'; m.style.top = top + 'px';
    m.style.setProperty('--ox', (a.left + a.width / 2 - left) + 'px');
    m.style.setProperty('--oy', (top > a.top ? 0 : mh) + 'px');
    anchor.setAttribute('aria-expanded', 'true');
    menuState = { bg, m, anchor };
    bg.addEventListener('pointerdown', () => closeMenu());
    m.addEventListener('click', e => { const it = e.target.closest('.menu-item'); if (!it) return; const v = it.dataset.v; closeMenu(); onPick(v); });
    if (matchMedia('(hover: hover)').matches){ const first = m.querySelector('.sel') || m.querySelector('.menu-item'); if (first) first.focus({ preventScroll:true }); }
  }
  function closeMenu(instant){
    if (!menuState) return;
    const { bg, m, anchor } = menuState; menuState = null;
    if (anchor && anchor.isConnected) anchor.setAttribute('aria-expanded', 'false');
    bg.remove();
    if (instant || reduce) { m.remove(); return; }
    m.classList.add('out'); m.addEventListener('animationend', () => m.remove(), { once:true }); setTimeout(() => m.remove(), 400);
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && menuState) closeMenu(); });
  addEventListener('resize', () => closeMenu(true));
  const typeOpts = () => [...days().map(d => ({ value:d.name, label:d.name, color:d.color })), { value:'Sonstiges', label:'Sonstiges', color:'#9AA3B2' }, { value:'__new', label:'+ Neuer Trainingstag' }];
  const hasData = e => e.note || e.sets.some(x => x.reps !== '' || x.kg !== '' || x.kind === 'drop');
  const KIND_OPTS = [{value:'',label:'Normal'},{value:'drop',label:'Dropsatz',color:'#F08A00'}];
  function setType(v){
    if (v === '__new'){ openNewDay(); return; }
    const old = data.draft.exercises;
    data.draft.type = v;
    if (v !== 'Sonstiges'){
      // Übungen des Tages in fester Reihenfolge; schon Eingetragenes wird übernommen
      const plan = fromTemplate(v).map(t => { const had = old.find(e => e.name === t.name && hasData(e)); return had || t; });
      const extra = old.filter(e => hasData(e) && !plan.some(p => p.name === e.name));
      data.draft.exercises = [...plan, ...extra];
    } else if (untouched(data.draft)) data.draft.exercises = [];
    saveDraft(); renderMeta(); renderEditor();
  }
  $('#s-type').addEventListener('click', e => openMenu(e.currentTarget, typeOpts(), data.draft.type, setType));

  // ---- Alle eingetragenen Werte leeren ----
  $('#clear-all').addEventListener('click', () => {
    const bg = document.createElement('div'); bg.className = 'dlg-bg';
    bg.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="clr-t" aria-describedby="clr-d">
      <h2 id="clr-t">Alle Werte leeren?</h2>

    if (e.button > 0) return;
    const { r, w } = lensMetrics(), lens = $('#lens');
    tabDrag = { id: e.pointerId, x0: e.clientX, moved: false, w, left: r.left };
    try { tabBar.setPointerCapture(e.pointerId); } catch(_){}

    if (!tabDrag || e.pointerId !== tabDrag.id) return;
    if (!tabDrag.moved && Math.abs(e.clientX - tabDrag.x0) < 6) return;
    tabDrag.moved = true;
    const lens = $('#lens');
    lens.classList.add('drag');
    let x = e.clientX - tabDrag.left - 4 - tabDrag.w / 2;
    const maxX = tabDrag.w * 2;
    const over = x < 0 ? -x : x > maxX ? x - maxX : 0;   // wie weit über den Rand gezogen
    x = Math.max(0, Math.min(maxX, x));   // bleibt immer innerhalb der Leiste
    // am Rand: Blase zoomt federnd größer statt weiterzurutschen
    const z = over ? Math.min(0.45, over / 140) : 0;
    lens.style.scale = z ? `${1.1 + z} ${1.45 + z * 0.8}` : '';
    lens.style.transformOrigin = `${(x / maxX) * 100}% 50%`;   // wächst am Rand nach innen

    hoverTab(Math.max(0, Math.min(2, Math.round(x / tabDrag.w))));

    if (!tabDrag) return;

  // ---- Wischen zum Löschen im Verlauf ----
  const OPEN_X = -86;
  let sw = null, suppressClick = false;
  function setX(r, x, drag){
    const d = r.querySelector('details.session'); r.dataset.x = x;
    d.style.transform = x ? `translateX(${x}px)` : '';
    r.style.setProperty('--p', Math.max(0, Math.min(1, x / OPEN_X)).toFixed(3));
    r.classList.toggle('drag', !!drag);
  }
  function closeRows(except){ document.querySelectorAll('.swipe').forEach(r => { if (r !== except && +r.dataset.x) setX(r, 0); }); }
  $('#history').addEventListener('pointerdown', e => {
    const r = e.target.closest('.swipe'); if (!r || e.target.closest('.swipe-act')) return;
    sw = { r, x0: e.clientX, y0: e.clientY, base: +r.dataset.x || 0, mode: null, id: e.pointerId };
  });
  $('#history').addEventListener('pointermove', e => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;

      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){ sw.mode = 'h'; closeRows(sw.r); try { sw.r.setPointerCapture(e.pointerId); } catch(_){} }

    if (x < OPEN_X) x = OPEN_X + (x - OPEN_X) * 0.35;     // Gummiband-Effekt über das Ziel hinaus

  });
  function endSwipe(){
    if (!sw) return; const s = sw; sw = null;
    if (s.mode !== 'h') return;

  }

  $('#history').addEventListener('pointercancel', endSwipe);

  $('#history').addEventListener('click', e => {

  // ---- progress ----
  const TREND_PCT = 1; // unter ±1 % zählt als gleich
  function e1rm(s){ return (s.kg == null || s.reps == null) ? null : s.kg * (1 + s.reps / 30); }
  function exStats(ex){
    let best = null, bestSet = null, top = null, vol = 0, reps = 0;
    ex.sets.forEach(s => {
      const v = e1rm(s);
      if (v != null && (best == null || v > best)) { best = v; bestSet = s; }
      if (s.kg != null && (top == null || s.kg > top)) top = s.kg;
      if (s.kg != null && s.reps != null) vol += s.kg * s.reps;
      dropsOf(s).forEach(d => { if (d.kg != null && d.reps != null) vol += d.kg * d.reps; });
      if (s.reps != null) reps += s.reps;
    });
    // Ohne Gewicht (z. B. Rückenstrecker mit Körpergewicht) zählen die Wiederholungen
    const metric = best != null ? best : (reps || null);
    return { best, bestSet, top, vol, reps, sets: ex.sets.length, metric, byReps: best == null };
  }
  function trendOf(a, b){
    if (a == null || b == null || b === 0) return { cls:'', txt:'neu', dir:0 };
    const p = (a - b) / b * 100;
    if (p >= TREND_PCT) return { cls:'up', txt:'▲ +' + Math.round(p) + ' %', dir:1 };
    if (p <= -TREND_PCT) return { cls:'down', txt:'▼ ' + Math.round(p) + ' %', dir:-1 };
    return { cls:'', txt:'= gleich', dir:0 };
  }
  function spark(vals){
    const v = vals.filter(x => x != null);
    if (v.length < 2) return '<svg class="spark" viewBox="0 0 84 30" aria-hidden="true"></svg>';
    const min = Math.min(...v), max = Math.max(...v), rng = (max - min) || 1;
    const pts = v.map((x, i) => [4 + i * (76 / (v.length - 1)), 26 - ((x - min) / rng) * 22]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    return `<svg class="spark" viewBox="0 0 84 30" aria-hidden="true">
      <path d="${d} L${last[0].toFixed(1)} 30 L4 30 Z" fill="currentColor" opacity=".08"></path>
      <path d="${d}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity=".7"></path>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="var(--accent)"></circle></svg>`;
  }
  const kg1 = n => (Math.round(n * 10) / 10).toString().replace('.', ',');
  // ---- Kalender-Übersicht ----
  let calMonth = null, calSel = null;
  const sesVol = s => s.exercises.reduce((a, e) => a + exStats(e).vol, 0);
  const sesSets = s => s.exercises.reduce((a, e) => a + e.sets.length, 0);
  const typeCol = t => t === 'Push' ? '#2F7BF5' : t === 'Pull' ? '#9358F2' : dayColor(t);
  const fmtVol = v => v >= 1000 ? (Math.round(v / 100) / 10).toLocaleString('de-DE') + ' t' : Math.round(v).toLocaleString('de-DE') + ' kg';
  const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  function volChart(all){
    const now = new Date();
    if (!calMonth) calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const y = calMonth.getFullYear(), m = calMonth.getMonth(), prefix = `${y}-${String(m + 1).padStart(2, '0')}`;
    const byDay = new Map();
    all.forEach(s => { if (!byDay.has(s.date)) byDay.set(s.date, []); byDay.get(s.date).push(s); });
    const daysIn = new Date(y, m + 1, 0).getDate(), lead = (new Date(y, m, 1).getDay() + 6) % 7, today = isoDay(now);
    const monthSes = all.filter(s => s.date.startsWith(prefix));
    const pm = new Date(y, m - 1, 1), prevPrefix = `${pm.getFullYear()}-${String(pm.getMonth() + 1).padStart(2, '0')}`;
    const prevCount = all.filter(s => s.date.startsWith(prevPrefix)).length;
    if (!calSel || !calSel.startsWith(prefix)) calSel = monthSes.length ? monthSes[monthSes.length - 1].date : (today.startsWith(prefix) ? today : null);
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<span class="cd empty" aria-hidden="true"></span>';
    for (let d = 1; d <= daysIn; d++){
      const key = isoDay(new Date(y, m, d)), ss = byDay.get(key) || [];
      const cols = [...new Set(ss.map(s => typeCol(s.type)))];
      const bg = cols.length === 1 ? cols[0] : cols.length > 1 ? `linear-gradient(135deg, ${cols[0]} 50%, ${cols[1]} 50%)` : '';
      const cls = ['cd', ss.length ? 'has' : '', key === today ? 'today' : '', key === calSel ? 'sel' : '', key > today ? 'future' : ''].filter(Boolean).join(' ');
      cells += `<button type="button" class="${cls}" data-cd="${key}"${bg ? ` style="--c:${bg}"` : ''} aria-label="${d}. ${ss.length ? ss.map(s => s.type).join(' und ') : 'kein Training'}"${key === calSel ? ' aria-pressed="true"' : ''}>${d}</button>`;
    }
    const counts = {}; monthSes.forEach(s => counts[s.type] = (counts[s.type] || 0) + 1);
    const vol = monthSes.reduce((a, s) => a + sesVol(s), 0);
    const diff = monthSes.length - prevCount;
    const weeks = (today.startsWith(prefix) ? now.getDate() : daysIn) / 7;
    const perWeek = monthSes.length ? (Math.round(monthSes.length / Math.max(1, weeks) * 10) / 10).toLocaleString('de-DE') : '0';
    const selSes = calSel ? (byDay.get(calSel) || []) : [];
    const detail = !calSel ? '' : selSes.length ? selSes.map(s => `
      <div class="cdet">
        <span class="dotc" style="background:${typeCol(s.type)}"></span>
        <div><b>${esc(fmtDate(s.date))} · ${esc(s.type)}</b><br>${s.exercises.length} ${s.exercises.length === 1 ? 'Übung' : 'Übungen'} · ${sesSets(s)} Sätze · ${fmtVol(sesVol(s))}
        <div class="cex">${s.exercises.map(e => esc(e.name)).join(' · ')}</div></div>
      </div>`).join('') : `<div class="cdet muted"><span class="dotc" style="background:var(--line2)"></span><div>${esc(fmtDate(calSel))}: kein Training</div></div>`;
    const legend = [...new Set([...days().map(d => d.name), ...monthSes.map(s => s.type)])].filter(t => counts[t] || t === 'Push' || t === 'Pull')
      .map(t => `<span><i style="background:${typeCol(t)}"></i>${esc(t)}${counts[t] ? ` <b>${counts[t]}×</b>` : ''}</span>`).join('');
    return `<div class="card vol cal">
      <div class="cal-head">
        <button type="button" class="icon" data-cm="-1" aria-label="Vorheriger Monat">‹</button>
        <h2>${calMonth.toLocaleDateString('de-DE', { month:'long', year:'numeric' })}</h2>
        <button type="button" class="icon" data-cm="1" aria-label="Nächster Monat">›</button>
      </div>
      <div class="cal-grid" role="grid">
        ${['Mo','Di','Mi','Do','Fr','Sa','So'].map(w => `<span class="cw">${w}</span>`).join('')}
        ${cells}
      </div>
      <div class="legend cal-legend">${legend}</div>
      <div class="vstats">
        <div><b>${monthSes.length}</b><span>Trainings${prevCount || monthSes.length ? ` · <em class="${diff > 0 ? 'up' : diff < 0 ? 'down' : ''}">${diff > 0 ? '+' : diff < 0 ? '−' : '±'}${Math.abs(diff)}</em> zum Vormonat` : ''}</span></div>
        <div><b>${perWeek}</b><span>Ø pro Woche</span></div>
        <div><b>${fmtVol(vol)}</b><span>Volumen im Monat</span></div>
      </div>
      ${detail}
    </div>`;
  }
  function refreshVol(){
    const el = document.querySelector('#progress .vol'); if (!el) return;
    const all = [...data.sessions].sort((a, b) => (a.date + a.id).localeCompare(b.date + b.id));

  }
  $('#progress').addEventListener('click', e => {
    const n = e.target.closest('[data-cm]'); if (n){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + (+n.dataset.cm), 1); calSel = null; refreshVol(); return; }
    const d = e.target.closest('[data-cd]'); if (d){ calSel = d.dataset.cd; refreshVol(); }
  });
  function renderProgress(){
    const list = [...data.sessions].sort((a, b) => (a.date + a.id).localeCompare(b.date + b.id));
    if (!list.length){
      $('#progress').innerHTML = `<div class="empty">Hier siehst du, ob du dich verbesserst.<br>Speichere deine erste Session, dann geht's los.</div>`;
      return;
    }
    const byName = new Map();
    list.forEach(s => s.exercises.forEach(e => {
      if (!byName.has(e.name)) byName.set(e.name, { name: e.name, type: s.type, rows: [] });
      const g = byName.get(e.name); g.type = s.type;

          <tbody>${r.slice().reverse().map(x => `<tr>
            <td>${new Date(x.date + 'T00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</td>
            <td>${x.sets}</td>
            <td>${x.bestSet ? kg1(x.bestSet.kg) + ' × ' + x.bestSet.reps : '–'}</td>
            <td>${x.byReps ? x.reps : kg1(x.best) + ' kg'}</td>
            <td>${x.vol ? Math.round(x.vol).toLocaleString('de-DE') + ' kg' : '–'}</td></tr>`).join('')}</tbody>
        </table>
        <p class="muted small" style="margin:8px 0 0">Kraftwert = geschätztes Maximalgewicht für 1 Wiederholung aus deinem besten Satz (Gewicht × (1 + Wdh/30)). So zählen mehr Wiederholungen und mehr Gewicht beide als Fortschritt.</p></div>

      <p class="muted small" style="margin:0 0 8px">Vergleich: letzte Session gegen die davor, pro Übung</p>

  // ---- init ----
  renderMeta(); renderEditor();
  if (!storageOk) say('Hinweis: Der Browser erlaubt hier kein Speichern. Daten gehen beim Schließen verloren.', true);

  showTab('new');

  // ---- online/offline badge ----

  // ---- backup ----
  function bsay(m, err){ const el = $('#bstatus'); el.textContent = m; el.classList.toggle('err', !!err); }
  $('#exp').addEventListener('click', async () => {
    const json = JSON.stringify({ app:'trainingslog', version:1, exported:new Date().toISOString(), sessions:data.sessions }, null, 1);

  function importJson(txt){
    let obj; try { obj = JSON.parse(txt); } catch(e){ bsay('Das ist keine gültige Sicherung.', true); return; }
    const list = Array.isArray(obj) ? obj : obj.sessions;
    if (!Array.isArray(list)){ bsay('In der Datei wurden keine Sessions gefunden.', true); return; }
    const ids = new Set(data.sessions.map(s => String(s.id)));
    let n = 0;
    list.forEach(s => { if (s && s.date && Array.isArray(s.exercises) && !ids.has(String(s.id))) { data.sessions.push(s); ids.add(String(s.id)); n++; } });

  $('#imp-btn').addEventListener('click', () => $('#imp-file').click());

  // ---- offline support ----
  // Offline-Funktion + automatische Updates: neue Version wird beim Öffnen geholt und die Seite einmal neu geladen
  if ('serviceWorker' in navigator){
    const hadCtrl = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl && !reloaded){ reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(reg => {
      reg.update().catch(()=>{});
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(()=>{}); });
    }).catch(()=>{});
  }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
})();
</script>
